        systemProperty 'modpedia.benchmark.runMods', project.property('benchmarkRunMods')
    }
    if (project.hasProperty('benchmarkDownloads')) {
        systemProperty 'modpedia.benchmark.downloads', project.property('benchmarkDownloads')
    }
    if (project.hasProperty('benchmarkReportDirectory')) {
        systemProperty 'modpedia.benchmark.reportDirectory', project.property('benchmarkReportDirectory')
    }
    if (project.hasProperty('benchmarkSearchBudgetMs')) {
        systemProperty 'modpedia.benchmark.searchBudgetMs', project.property('benchmarkSearchBudgetMs')
    }
    if (project.hasProperty('benchmarkWarmupSamples')) {
