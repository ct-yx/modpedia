plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files

    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    // Add here additional repositories if required by some of the dependencies below.
}

base {
    archivesName = mod_id
}

// ForgeGradle keeps Jar-in-Jar opt-in; ModPedia ships its Worker dependencies here.
jarJar.enable()
tasks.named('jar').configure {
    archiveClassifier = 'slim'
}
tasks.named('jarJar').configure {
    archiveClassifier = ''
}

// Minecraft Forge 1.20.1 and its embedded Worker both target Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: project.minecraft_version
    copyIdeResources = true

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            workingDirectory project.file('run-server')
            args '--nogui'
            property 'forge.enabledGameTestNamespaces', project.mod_id
        }
        data {
            workingDirectory project.file('run-data')
            args '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
        configureEach {
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // SQLite is the derived runtime search index. The driver is embedded into the mod JAR.
    jarJar(implementation("org.xerial:sqlite-jdbc:3.53.2.1")) {
        version {
            strictly '[3.53.2.1, 3.54)'
        }
    }

    // LangChain4j 负责 ChatMemory、上下文窗口、工具调用和流式响应；ModPedia 只实现
    // 本地文件持久化适配器与知识库工具，避免重复实现通用 AI 编排逻辑。
    jarJar(implementation("dev.langchain4j:langchain4j:${langchain4j_version}")) {
        exclude group: "org.slf4j", module: "slf4j-api"
        // 所有 Worker 依赖都在下方以固定版本显式声明，避免 Jar-in-Jar
        // 同时打包传递依赖的旧版本。
        exclude group: "dev.langchain4j"
        exclude group: "com.fasterxml.jackson.core"
        exclude group: "org.apache.opennlp"
        exclude group: "org.jspecify"
        version {
            strictly "[${langchain4j_version}, 1.19)"
        }
    }
    jarJar(implementation("dev.langchain4j:langchain4j-open-ai:${langchain4j_version}")) {
        exclude group: "org.slf4j", module: "slf4j-api"
        exclude group: "dev.langchain4j"
        exclude group: "com.fasterxml.jackson.core"
        exclude group: "org.apache.opennlp"
        exclude group: "org.jspecify"
        exclude group: "com.knuddels"
        version {
            strictly "[${langchain4j_version}, 1.19)"
        }
    }
    // langchain4j-open-ai 和 JDK HTTP 实现的接口是独立模块。只声明上层模块时，
    // ModDev 的 Jar-in-Jar 产物不会自动把这些传递依赖放入最终模组，导致 SPI
    // 服务实现与 HttpClientBuilderFactory 来自不同的类加载器，运行时出现
    // "JdkHttpClientBuilderFactory not a subtype"。
    jarJar(implementation("dev.langchain4j:langchain4j-core:${langchain4j_version}")) {
        exclude group: "org.slf4j", module: "slf4j-api"
        exclude group: "dev.langchain4j"
        exclude group: "com.fasterxml.jackson.core"
        exclude group: "org.apache.opennlp"
        exclude group: "org.jspecify"
        version {
            strictly "[${langchain4j_version}, 1.19)"
        }
    }
    // Community SQL 提供成熟的 ChatMemoryStore 读写、JSON 序列化和 SQL 生命周期。
    // ModPedia 只保留 SQLite DataSource 与方言装配，不再维护完整持久化适配器。
    jarJar(implementation("dev.langchain4j:langchain4j-community-sql:${langchain4j_community_sql_version}")) {
        exclude group: "org.slf4j", module: "slf4j-api"
        exclude group: "dev.langchain4j"
        exclude group: "com.fasterxml.jackson.core"
        exclude group: "org.apache.opennlp"
        exclude group: "org.jspecify"
        version {
            strictly "[${langchain4j_community_sql_version}, 1.19)"
        }
    }
    jarJar(implementation("dev.langchain4j:langchain4j-http-client:${langchain4j_version}")) {
        exclude group: "org.slf4j", module: "slf4j-api"
        exclude group: "dev.langchain4j"
        exclude group: "com.fasterxml.jackson.core"
        exclude group: "org.apache.opennlp"
        exclude group: "org.jspecify"
        version {
            strictly "[${langchain4j_version}, 1.19)"
        }
    }
    jarJar(implementation("dev.langchain4j:langchain4j-http-client-jdk:${langchain4j_version}")) {
        exclude group: "org.slf4j", module: "slf4j-api"
        exclude group: "dev.langchain4j"
        exclude group: "com.fasterxml.jackson.core"
        exclude group: "org.apache.opennlp"
        exclude group: "org.jspecify"
        version {
            strictly "[${langchain4j_version}, 1.19)"
        }
    }

    // LangChain4j 的运行时依赖也要显式进入 Jar-in-Jar；否则开发环境能运行，
    // 独立安装的发布 JAR 会在真正请求模型时缺少 Jackson、tokenizer 或 OpenNLP。
    jarJar(implementation("com.fasterxml.jackson.core:jackson-annotations:2.22")) {
        version {
            strictly '[2.22, 2.23)'
        }
    }
    jarJar(implementation("com.fasterxml.jackson.core:jackson-core:2.22.1")) {
        version {
            strictly '[2.22.1, 2.23)'
        }
    }
    jarJar(implementation("com.fasterxml.jackson.core:jackson-databind:2.22.1")) {
        version {
            strictly '[2.22.1, 2.23)'
        }
    }
    jarJar(implementation("org.apache.opennlp:opennlp-tools:2.5.9")) {
        exclude group: "org.slf4j", module: "slf4j-api"
        version {
            strictly '[2.5.9, 2.6)'
        }
    }
    jarJar(implementation("com.knuddels:jtokkit:${jtokkit_version}")) {
        version {
            strictly "[${jtokkit_version}, 1.2)"
        }
    }
    jarJar(implementation("org.jspecify:jspecify:1.0.0")) {
        version {
            strictly '[1.0.0, 2.0)'
        }
    }
    // Gson 已由 Minecraft/NeoForge 运行时提供。不要把它作为 Jar-in-Jar
    // 嵌入，否则发布模组会和游戏自身的 com.google.gson 模块重复。
    compileOnly("com.google.code.gson:gson:2.11.0") {
        version {
            strictly '[2.11, 2.12)'
        }
    }
    // SLF4J API 由 NeoForge/Minecraft 运行时提供。Worker 复用游戏进程的基础
    // classpath，因此只保留编译依赖和开发运行时依赖，不能再把同一个 API
    // 作为 Jar-in-Jar 嵌入模组，否则会和整合包的 org.slf4j 模块重复。
    compileOnly("org.slf4j:slf4j-api:2.0.9")
    // 基准报告和测试夹具直接读取 JSON。
    testImplementation "com.google.code.gson:gson:2.11.0"

    // Example optional mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}"
    // We add the full version to localRuntime, not runtimeOnly, so that we do not publish a dependency on it
    // localRuntime "mezz.jei:jei-${mc_version}-neoforge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

