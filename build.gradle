    // 验证 Gradle 开发 classpath。测试夹具不调用模型，也不访问网络。
    dependsOn tasks.named('jarJar')
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath + sourceSets.main.compileClasspath
    mainClass = 'io.ctyx.modpedia.worker.WorkerIpcSelfTest'
    systemProperty 'modpedia.worker.jar', tasks.named('jarJar').flatMap { it.archiveFile }.get().asFile.absolutePath
    systemProperty 'modpedia.langchain4j.version', langchain4j_version
    systemProperty 'modpedia.jtokkit.version', jtokkit_version
}

