// 这些自测试不依赖图形客户端或真实模型；让标准 test 入口直接执行，避免
// 只编译测试类却漏掉布局、滚动和“禁止进世界扫描”的回归。
test.dependsOn manualCatalogSelfTest,
        legacyItemIdentitySelfTest,
        legacyMarkdownCompilerSelfTest,
        legacyFtbQuestNormalizerSelfTest,
        legacyFtbQuestRuntimeSelfTest,
        legacyFtbQuestEventBridgeSelfTest,
        legacyPanelLayoutSelfTest,
        legacyCatalogCaptureGateSelfTest,
        legacyItemCatalogProgressSelfTest,
        legacyItemCatalogCacheSelfTest,
        userModPediaPathsSelfTest,
        legacyRuntimeMaterialFactsReaderSelfTest,
        legacyItemTooltipFormatterSelfTest,
        legacyMarkdownParserSelfTest,
        legacyConversationStateSelfTest,
        legacyConversationPayloadSelfTest,
        legacyScrollModelSelfTest,
        legacyManualNavigatorSelfTest,
        legacyJeiBridgeSelfTest
