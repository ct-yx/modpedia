plugins {
    id 'base'
}

/**
 * refactor/client-core 是 loader-neutral client-core 的聚合工程。
 * Minecraft 模组和 Worker 源码不属于本分支的生产 source set。
 */
tasks.named('clean') {
    dependsOn(':client-core:clean')
}

tasks.named('check') {
    dependsOn(':client-core:check')
}

tasks.named('build') {
    dependsOn(':client-core:build')
}
