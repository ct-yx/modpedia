def workerIpcSelfTest = tasks.register('workerIpcSelfTest', JavaExec) {
    // 使用最终 Jar-in-Jar 产物启动子 JVM，验证发布 JAR 的 Worker 入口，而不是只
    // 验证 Gradle 开发 classpath。测试夹具不调用模型，也不访问网络。
    dependsOn tasks.named('jar')
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath + sourceSets.main.compileClasspath
    mainClass = 'io.ctyx.modpedia.worker.WorkerIpcSelfTest'
    systemProperty 'modpedia.worker.jar', tasks.named('jar').flatMap { it.archiveFile }.get().asFile.absolutePath
}

