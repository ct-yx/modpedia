buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
    }
    dependencies {
        // ForgeGradle 2.3 生成 1.12.2 Forge 兼容构件；不引入目标加载器专用 API。
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.3-SNAPSHOT'
    }
}

// ForgeGradle 2.3 uses the legacy Forge 1.12.2 plugin id.  Cleanroom 0.3+
// keeps the corresponding Forge lifecycle/API surface, so the common source
// remains usable by both the compile baseline and the target runtime.
apply plugin: 'net.minecraftforge.gradle.forge'
apply plugin: 'java'

version = project.mod_version
group = project.mod_group_id
archivesBaseName = project.mod_id

sourceCompatibility = targetCompatibility = '1.8'

// 所有 Minecraft 版本共用的 loader-neutral 安装与 IPC 适配层。
// Worker 实现只来自 modpedia-refactor-worker-core，不在 1.12.2 主模组中编译。
sourceSets {
    main {
        java {
            srcDir 'client-core/src/main/java'
            exclude 'io/ctyx/modpedia/worker/**'
        }
    }
}

repositories {
    mavenCentral()
}

// client-core 的 Java 8 Ed25519 验签 provider 必须随主模组提供；Worker
// 实现仍从独立 Java 17 Core JAR 启动，不能从此分支源码或产物中带入。
configurations {
    modpediaClientRuntime
}

dependencies {
    implementation 'net.i2p.crypto:eddsa:0.3.0'
    modpediaClientRuntime 'net.i2p.crypto:eddsa:0.3.0'
}

minecraft {
    version = "${project.minecraft_version}-${project.forge_version}"
    mappings = 'snapshot_20171003'
    // ForgeGradle 2.3 requires a runDir even when this migration branch does
    // not launch a test client. Keep it under build/ rather than creating a
    // project-level run/ directory.
    runDir = 'build/forge-run'
    makeObfSourceJar = false
}

processResources {
    inputs.property 'mod_id', project.mod_id
    inputs.property 'mod_name', project.mod_name
    inputs.property 'mod_version', project.mod_version
    inputs.property 'mod_description', project.mod_description

    filesMatching(['mcmod.info', 'pack.mcmeta']) {
        expand(
                mod_id: project.mod_id,
                mod_name: project.mod_name,
                mod_version: project.mod_version,
                mod_description: project.mod_description
        )
    }
}

jar {
    // ForgeGradle 2.3 没有现代 jarJar 配置；只把 client-core 的 EdDSA
    // provider 展开到主模组，避免将 Minecraft/Worker 依赖一起打包。
    from {
        configurations.modpediaClientRuntime.collect { dependency ->
            dependency.isDirectory() ? dependency : zipTree(dependency)
        }
    }
    exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA'
    manifest {
        attributes(
                'Specification-Title': project.mod_name,
                'Specification-Vendor': 'ctyx',
                'Specification-Version': '1',
                'Implementation-Title': project.mod_name,
                'Implementation-Version': project.mod_version,
                'Implementation-Vendor': 'ctyx'
        )
    }
}

// The migration branch keeps executable, dependency-light self-tests next to
// the first compatibility layer.  They are intentionally separate from the
// game launch tasks and do not create a run directory.
task manualCatalogSelfTest(type: JavaExec) {
    dependsOn testClasses
    main = 'io.ctyx.modpedia.knowledge.ManualCatalogScannerSelfTest'
    classpath = sourceSets.test.runtimeClasspath
}

