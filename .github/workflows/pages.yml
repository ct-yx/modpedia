name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/site/**'
      - '.github/workflows/pages.yml'
      - 'scripts/validate_release_artifacts.py'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Preserve latest published Worker manifest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          manifest="docs/site/worker/latest.json"
          manifest_status="$(python3 - "$manifest" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              print(json.load(handle).get("integrity_status", ""))
          PY
          )"
          if [[ "$manifest_status" != "pending-release" ]]; then
            echo "Pages manifest status: $manifest_status"
            exit 0
          fi

          release_json="$(mktemp)"
          release_error="$(mktemp)"
          set +e
          gh api "repos/${GITHUB_REPOSITORY}/releases/latest" >"$release_json" 2>"$release_error"
          release_status=$?
          set -e
          if [[ "$release_status" -ne 0 ]]; then
            if grep -Eq 'HTTP 404|Not Found' "$release_error"; then
              echo "没有已发布 Release，保留 pending-release 占位清单。"
              exit 0
            fi
            cat "$release_error" >&2
            exit "$release_status"
          fi

          download_dir="$(mktemp -d)"
          download_error="$(mktemp)"
          if ! gh release download --repo "$GITHUB_REPOSITORY" --pattern latest.json \
              --dir "$download_dir" --clobber 2>"$download_error"; then
            if grep -Fq 'no assets match the file pattern' "$download_error"; then
              echo "历史 Release 没有签名 latest.json，保留 pending-release 占位清单。"
              exit 0
            fi
            cat "$download_error" >&2
            echo "::error::读取最新 Release 的 Worker 清单失败；拒绝覆盖 Pages。"
            exit 1
          fi
          published="$download_dir/latest.json"
          test -s "$published"
          published_status="$(python3 - "$published" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              print(json.load(handle).get("integrity_status", ""))
          PY
          )"
          if [[ "$published_status" != "signed" ]]; then
            echo "::error::最新 Release 的 Worker 清单不是 signed 状态：$published_status"
            exit 1
          fi
          cp "$published" "$manifest"
          echo "已恢复最新已签名 Worker 清单，避免普通 main push 覆盖 Pages。"

      - name: Validate Worker latest manifest
        run: python3 scripts/validate_release_artifacts.py --manifest docs/site/worker/latest.json

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
