name: Publish Mod Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要重新发布的版本标签，例如 v1.2.0'
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve release metadata
        id: release-meta
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG#refs/tags/}"
          case "$tag" in
            v[0-9]*) ;;
            *) echo "::error::Expected a version tag beginning with v: $tag"; exit 1 ;;
          esac
          version="${tag#v}"
          case "$tag" in
            *-alpha*) version_type=alpha ;;
            *-beta*|*-rc*) version_type=beta ;;
            *) version_type=release ;;
          esac
          {
            printf 'tag=%s\n' "$tag"
            printf 'version=%s\n' "$version"
            printf 'version_type=%s\n' "$version_type"
          } >> "$GITHUB_OUTPUT"

      - name: Validate publishing credentials
        env:
          PROJECT_ID: ${{ vars.MODPEDIA || vars.CURSEFORGE_PROJECT_ID }}
          API_TOKEN: ${{ secrets.MODPEDIA || secrets.CURSEFORGE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PROJECT_ID" || { echo '::error::Repository project ID variable is not configured'; exit 1; }
          test -n "$API_TOKEN" || { echo '::error::Repository publishing secret is not configured'; exit 1; }

      - name: Run tests and build
        run: |
          ./gradlew test build
          git diff --check

      - name: Prepare release file and notes
        id: package
        env:
          RELEASE_TAG: ${{ steps.release-meta.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release-meta.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          jar_file="$(find build/libs -maxdepth 1 -type f -name 'modpedia-*.jar' \
            ! -name '*-sources.jar' ! -name '*-javadoc.jar' | sort | head -n 1)"
          test -n "$jar_file"
          mkdir -p build/publish
          publish_file="build/publish/modpedia-${RELEASE_VERSION}.jar"
          cp "$jar_file" "$publish_file"
          awk '
            /^## / {
              if (found) exit
              found = 1
            }
            found { print }
          ' CHANGELOG.md > build/publish/release-notes.md
          test -s build/publish/release-notes.md
          grep -Fxq "## ${RELEASE_TAG}" build/publish/release-notes.md
          printf 'file=%s\n' "$publish_file" >> "$GITHUB_OUTPUT"

      - name: Publish to CurseForge
        uses: Kira-NT/mc-publish@v3.3
        with:
          curseforge-id: ${{ vars.MODPEDIA || vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.MODPEDIA || secrets.CURSEFORGE_TOKEN }}
          files: ${{ steps.package.outputs.file }}
          name: ModPedia · 模组百科 ${{ steps.release-meta.outputs.version }}
          version: ${{ steps.release-meta.outputs.version }}
          version-type: ${{ steps.release-meta.outputs.version_type }}
          changelog-file: build/publish/release-notes.md
          loaders: neoforge
          game-versions: 1.21.1
