name: Release Beta

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    if: contains(github.ref_name, '-beta.')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests and build
        run: |
          ./gradlew test build
          git diff --check

      - name: Create checksums
        shell: bash
        run: |
          jar_file="$(find build/libs -maxdepth 1 -type f -name 'modpedia-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | sort | head -n 1)"
          test -n "$jar_file"
          sha256sum "$jar_file" > SHA256SUMS
          printf '%s\n' "$jar_file" > release-jar-path.txt

      - name: Publish GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          jar_file="$(cat release-jar-path.txt)"
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "ModPedia $GITHUB_REF_NAME" \
            --notes-file CHANGELOG.md \
            --prerelease \
            "$jar_file" \
            SHA256SUMS \
            CHANGELOG.md \
            INSTALL.md \
            KNOWN_LIMITATIONS.md
