name: Release contract gates

on:
  push:
    branches: [main]
    paths:
      - '.github/release-inputs.json'
      - '.github/workflows/release-contract.yml'
      - 'scripts/validate_release_inputs.py'
      - 'scripts/validate_release_artifacts.py'
      - 'scripts/generate_worker_manifest.py'
      - 'scripts/worker_manifest_signature.py'
      - 'scripts/sign_worker_manifest.py'
      - 'scripts/validate_worker_signature.py'
      - 'scripts/test_worker_manifest_signature.py'
      - 'docs/site/worker/latest.json'
  pull_request:
    paths:
      - '.github/release-inputs.json'
      - '.github/workflows/release-contract.yml'
      - 'scripts/**'
      - 'docs/site/worker/latest.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-inputs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Validate exact release refs
        run: python3 scripts/validate_release_inputs.py .github/release-inputs.json
      - name: Compile release validation scripts
        run: python3 -m py_compile scripts/validate_release_inputs.py scripts/validate_release_artifacts.py scripts/worker_manifest_signature.py scripts/sign_worker_manifest.py scripts/validate_worker_signature.py
      - name: Test canonical payload and Ed25519 verifier
        run: python3 scripts/test_worker_manifest_signature.py
      - name: Resolve every locked commit
        id: refs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/modpedia-release-refs.txt
          import json
          from pathlib import Path
          data = json.loads(Path('.github/release-inputs.json').read_text())
          print(data['worker']['ref'])
          print(data['client_core']['ref'])
          for version in ('1.21.1', '1.20.1', '1.12.2'):
              print(data['versions'][version]['ref'])
          PY
          git fetch --quiet origin '+refs/heads/*:refs/remotes/origin/*'
          while read -r ref; do git cat-file -e "$ref^{commit}"; done < /tmp/modpedia-release-refs.txt
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          data = json.loads(Path('.github/release-inputs.json').read_text())
          print(f"client_core_ref={data['client_core']['ref']}")
          print(f"worker_ref={data['worker']['ref']}")
          print(f"worker_version={data['worker']['worker_version']}")
          print(f"legacy_ref={data['versions']['1.12.2']['ref']}")
          PY
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: Checkout exact client-core ref
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ steps.refs.outputs.client_core_ref }}
          path: source-client-core
          fetch-depth: 1
      - name: Build pinned client-core with EdDSA provider
        working-directory: source-client-core
        shell: bash
        run: |
          set -euo pipefail
          test -f client-core/build.gradle
          grep -Fq "net.i2p.crypto:eddsa:0.3.0" client-core/build.gradle
          ./gradlew -p client-core clean check --no-daemon --no-configuration-cache
      - name: Verify client-core Java 8 bytecode
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import struct
          roots = [
              pathlib.Path('source-client-core/client-core/build/classes/java/main'),
              pathlib.Path('source-client-core/client-core/build/classes/java/test'),
          ]
          paths = [path for root in roots if root.exists() for path in root.rglob('*.class')]
          if not paths:
              raise SystemExit('client-core produced no class files')
          for path in paths:
              data = path.read_bytes()
              major = struct.unpack('>H', data[6:8])[0]
              if major > 52:
                  raise SystemExit(f'{path}: class major {major}')
          print('client-core Java 8 bytecode: OK')
          PY

  legacy-1122:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read exact 1.12.2 ref
        id: inputs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          data = json.loads(Path('.github/release-inputs.json').read_text())
          print(f"ref={data['versions']['1.12.2']['ref']}")
          print(f"worker_ref={data['worker']['ref']}")
          print(f"worker_version={data['worker']['worker_version']}")
          PY
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ steps.inputs.outputs.ref }}
          path: source-1.12.2
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ steps.inputs.outputs.worker_ref }}
          path: worker-core
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Worker JAR from locked Core ref
        working-directory: worker-core
        env:
          WORKER_VERSION: ${{ steps.inputs.outputs.worker_version }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew clean workerJar workerClassMajorSelfTest --no-daemon --no-configuration-cache -Pmod_version="$WORKER_VERSION"
          worker="$(find build/libs -maxdepth 1 -type f -name 'modpedia-worker-*.jar' | sort | head -n 1)"
          test -s "$worker"
          echo "WORKER_JAR=$GITHUB_WORKSPACE/worker-core/$worker" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile, test and build exact 1.12.2 ref
        working-directory: source-1.12.2
        env:
          RELEASE_VERSION: 'contract-1.12.2'
        run: ./gradlew clean test build --no-daemon -Pmod_version="$RELEASE_VERSION" -Pworker_jar="$WORKER_JAR"
      - name: Verify 1.12.2 artifact excludes Worker
        shell: bash
        run: |
          set -euo pipefail
          legacy="$(find source-1.12.2/build/libs -maxdepth 1 -type f -name 'modpedia-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | sort | head -n 1)"
          test -s "$legacy"
          python3 scripts/validate_release_artifacts.py --worker "$WORKER_JAR" --mod "$legacy" --worker-major 61
