org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=false
org.gradle.caching=true

# 1.12.2 双运行时兼容基线：业务代码只使用 Forge 1.12.2 API，
# 目标加载器 0.3+ 作为运行时兼容目标，不引入 0.6+ 专用 API。
minecraft_version=1.12.2
# 14.23.5.2847 is the newest 1.12.2 Forge userdev artifact still published
# with the legacy ForgeGradle 2.3 layout; its common API is compatible with
# the Cleanroom 0.3+ target.
forge_version=14.23.5.2847
target_loader_line=0.3+

mod_id=modpedia
# ForgeGradle 2.3 reads gradle.properties through the legacy Java properties
# encoding. Keep the display name as Unicode escapes so mcmod.info stays UTF-8.
mod_name=ModPedia \u00b7 \u6a21\u7ec4\u767e\u79d1
mod_description=Minecraft 1.12.2 local knowledge assistant
mod_version=1.12.2-0.1.0
mod_group_id=io.ctyx.modpedia

# Worker 继续使用独立的固定基线；1.12.2 客户端后续通过 Java 21 Worker 适配。
worker_baseline=worker-baseline-3
# 发布时嵌入 Worker 包；可用 -Pworker_jar 覆盖此默认同级路径。
worker_jar=../modpedia-worker/build/libs/modpedia-1.2.0-fix.jar
# SLF4J API 由 Worker 专用资源提供，不从 Forge/NeoForge 类加载器获取。
slf4j_version=2.0.9
